name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Compile main sources
        run: |
          mkdir -p build/main
          find src/main/java -name '*.java' > sources.txt
          javac -d build/main @sources.txt

      - name: Download JUnit console launcher
        run: |
          curl -sSL -o junit.jar https://repo1.maven.org/maven2/org/junit/platform/junit-platform-console-standalone/1.10.2/junit-platform-console-standalone-1.10.2.jar

      - name: Compile tests
        run: |
          mkdir -p build/test
          find src/test/java -name '*.java' > tests.txt
          javac -cp "build/main:junit.jar" -d build/test @tests.txt

      - name: Run tests
        run: |
          java -cp "junit.jar:build/main:build/test" \
            org.junit.platform.console.ConsoleLauncher --scan-class-path build/test
